name: 질문
description: 코드·구조에 대한 질문
title: "[질문] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **공개 저장소입니다.** 이슈와 댓글은 누구나 봅니다.
        - 실제 학생·선생님·보호자·학원 정보와 실데이터 화면을 넣지 마세요. 스크린샷은 가짜 데이터로만 찍습니다.
        - 비밀값, 운영 서버 주소·계정, 기준값을 넣지 마세요. 로그는 이름·토큰·입력값·사진 주소를 지우고 붙입니다.
        - **보안 취약점은 이슈로 올리지 마세요.** 저장소 담당에게 직접 알립니다.
  - type: markdown
    attributes:
      value: |
        기획·범위는 PM, 개인정보·약관은 법무, 기술 결정은 개발 총괄에게 묻습니다(공통 문서 AI_RULES 4장). 이 이슈는 코드와 구조에 대한 질문에 씁니다.
  - type: textarea
    id: question
    attributes:
      label: 질문
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 관련 문서·WBS ID
      placeholder: "예: docs/common/GLOSSARY.md, 1.0.24a"
  - type: checkboxes
    id: public-check
    attributes:
      label: 공개 저장소 확인
      options:
        - label: 실제 학생·학원 정보, 비밀값, 서버 주소·계정이 없습니다
          required: true
