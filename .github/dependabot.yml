# Dependabot 설정
# - 공통 문서(docs/common) 서브모듈: 매일 확인(규칙 변경이 빨리 반영되도록). PR은 항상 1건만 열린다.
# - 패키지·액션: 매월 확인하고, 작은 업데이트(minor·patch)는 PR 하나로 묶는다. 큰 업데이트(major)만 따로 연다.
# - 보안 업데이트는 저장소 설정(Dependabot security updates)이 이 일정과 상관없이 바로 따로 올린다.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 11.x는 compileSdk 37이 필요해 지금 빌드가 깨진다(pubspec.yaml 메모). SDK 정리 후 수동으로 올린다.
      - dependency-name: flutter_secure_storage
        versions: [">=11.0.0"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
